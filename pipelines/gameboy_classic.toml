name = "gameboy_classic"
description = "Original 1989 handheld DMG-01 dot-matrix screen with 4-level olive Bayer dithering, pixel cell grid, and passive matrix ghosting"
input = "test_input.mp4"
output = "output_gameboy_classic.mp4"

[settings]
scale = 1.0
crf = 18
preset = "medium"
copy_audio = true

[[passes]]
shader = "pixelate"
enabled = true
[passes.params]
pixel_size = 4.0
color_levels = 16.0
grid_line = 0.0

[[passes]]
shader = "bayer_dither"
enabled = true
[passes.params]
palette = 1
levels = 4.0
spread = 0.35
scale = 2.0
blend = 1.0

[[passes]]
shader = "lcd_matrix"
enabled = true
[passes.params]
cell_size = 4.0
grid_gap = 0.15
ghosting = 0.50
subpixel_type = 1
brightness = 1.15
intensity = 0.90

[[passes]]
shader = "vignette"
enabled = true
[passes.params]
intensity = 0.35
radius = 0.85
softness = 0.3
