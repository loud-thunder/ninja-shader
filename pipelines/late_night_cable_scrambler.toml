name = "late_night_cable_scrambler"
description = "Late night analog scrambled premium cable channel with continuous vertical roll de-sync, horizontal slice tearing, and RF snow"
input = "test_input.mp4"
output = "output_late_night_cable_scrambler.mp4"

[settings]
scale = 1.0
crf = 18
preset = "medium"
copy_audio = true

[[passes]]
shader = "tape_sync_roll"
enabled = true
[passes.params]
roll_speed = 0.8
sync_bar_width = 0.10
sync_bar_noise = 0.75
skew = 0.08
tear_intensity = 0.05
intensity = 1.0

[[passes]]
shader = "glitch_displacement"
enabled = true
[passes.params]
intensity = 0.04
band_frequency = 12.0
speed = 8.0
color_drift = 0.02

[[passes]]
shader = "rf_static"
enabled = true
[passes.params]
noise_intensity = 0.35
hum_bar_intensity = 0.20
hum_bar_speed = 1.2
signal_loss = 0.10
ghost_lag = 0.02
ghost_opacity = 0.15

[[passes]]
shader = "crt_scanlines"
enabled = true
[passes.params]
curvature = 0.06
scanline_intensity = 0.30
scanline_count = 380.0
