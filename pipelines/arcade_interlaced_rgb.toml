name = "arcade_interlaced_rgb"
description = "15kHz RGB arcade cabinet monitor running 480i interlaced video with motion comb artifacts, shadow mask triad, and bloom"
input = "test_input.mp4"
output = "output_arcade_interlaced_rgb.mp4"

[settings]
scale = 1.0
crf = 18
preset = "medium"
copy_audio = true

[[passes]]
shader = "interlaced_scan"
enabled = true
[passes.params]
field_order = 0
line_thickness = 1.0
comb_intensity = 0.65
flicker = 0.25
jitter = 0.001
intensity = 0.85

[[passes]]
shader = "crt_phosphor_mask"
enabled = true
[passes.params]
mask_type = 1
scale = 2.0
intensity = 0.55
brightness_boost = 1.25

[[passes]]
shader = "bloom"
enabled = true
[passes.params]
threshold = 0.60
intensity = 0.40
radius = 1.2
soft_knee = 0.2

[[passes]]
shader = "vignette"
enabled = true
[passes.params]
intensity = 0.35
radius = 0.85
softness = 0.35
