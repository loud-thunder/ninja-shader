name = "matrix_overdrive"
description = "Overclocked cyber terminal: digital ASCII code rain interrupted by displacement glitch slices and neon contours"
input = "test_input.mp4"
output = "output_matrix_overdrive.mp4"

[settings]
scale = 1.0
crf = 18
preset = "medium"
copy_audio = true

[[passes]]
shader = "ascii_matrix"
enabled = true
[passes.params]
glyph_size = 9.0
speed = 1.5
rain_density = 0.70

[[passes]]
shader = "glitch_displacement"
enabled = true
[passes.params]
intensity = 0.35
band_frequency = 22.0
speed = 3.0
color_drift = 0.02

[[passes]]
shader = "neon_edge"
enabled = true
[passes.params]
edge_threshold = 0.12
intensity = 1.25

[[passes]]
shader = "bloom"
enabled = true
[passes.params]
threshold = 0.45
intensity = 0.75
radius = 3.0
