name = "vhs_head_switch"
description = "VCR helical drum head-switching noise band, bottom-of-frame horizontal skew, and tape flutter"
author = "ninja-shader"
language = "wgsl"
source = "vhs_head_switch.wgsl"

[[params]]
name = "band_height"
type = "float"
default = 0.045
min = 0.01
max = 0.12
description = "Height of the tape head switching distortion zone"

[[params]]
name = "skew_amount"
type = "float"
default = 0.035
min = -0.1
max = 0.1
description = "Horizontal skew displacement amplitude inside the switching band"

[[params]]
name = "noise_intensity"
type = "float"
default = 0.7
min = 0.0
max = 1.0
description = "High-frequency tracking noise and static line intensity"

[[params]]
name = "flutter"
type = "float"
default = 0.4
min = 0.0
max = 1.0
description = "Intermittent frame flutter and phase jitter amplitude"

[[params]]
name = "position"
type = "int"
default = 0
min = 0
max = 1
description = "Band location (0: Bottom edge of raster, 1: Top edge of raster)"

[[params]]
name = "intensity"
type = "float"
default = 1.0
min = 0.0
max = 1.0
description = "Overall blend strength of head-switching artifact"
