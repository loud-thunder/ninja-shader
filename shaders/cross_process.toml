name = "cross_process"
description = "Chemical film cross-processing emulation with vivid contrast, cyan shadows, and warm highlights"
author = "ninja-shader"
language = "wgsl"
source = "cross_process.wgsl"

[[params]]
name = "strength"
type = "float"
default = 0.85
min = 0.0
max = 1.0
description = "Cross-processing blend amount"

[[params]]
name = "contrast"
type = "float"
default = 1.3
min = 0.5
max = 2.5
description = "S-curve tone contrast multiplier"

[[params]]
name = "shift_balance"
type = "float"
default = 0.2
min = -1.0
max = 1.0
description = "Color balance bias (negative for cold green/cyan, positive for golden warm)"
