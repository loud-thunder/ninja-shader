name = "solarize"
description = "Sabattier photographic tone inversion creating metallic surreal highlights"
author = "ninja-shader"
language = "wgsl"
source = "solarize.wgsl"

[[params]]
name = "threshold"
type = "float"
default = 0.5
min = 0.0
max = 1.0
description = "Luminance threshold above which tones are inverted"

[[params]]
name = "intensity"
type = "float"
default = 1.0
min = 0.0
max = 1.0
description = "Blend strength between original and solarized tones"

[[params]]
name = "mode"
type = "int"
default = 0
min = 0
max = 1
description = "Inversion mode (0: overall luminance, 1: per-channel RGB)"
