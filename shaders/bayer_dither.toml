name = "bayer_dither"
description = "Ordered 8x8 Bayer matrix dithering with retro palettes (Game Boy, CGA Mode 1, Amber CRT, Mac 1-bit)"
author = "ninja-shader"
language = "wgsl"
source = "bayer_dither.wgsl"

[[params]]
name = "palette"
type = "int"
default = 0
min = 0
max = 4
description = "Palette mode (0: Grayscale/Custom levels, 1: Game Boy 4-shade olive, 2: CGA Mode 1, 3: Amber CRT, 4: Mac 1-bit B&W)"

[[params]]
name = "levels"
type = "float"
default = 4.0
min = 2.0
max = 16.0
description = "Quantization levels when palette mode is 0 (Grayscale/Custom)"

[[params]]
name = "spread"
type = "float"
default = 0.35
min = 0.0
max = 1.0
description = "Dither pattern spread amplitude"

[[params]]
name = "scale"
type = "float"
default = 2.0
min = 1.0
max = 16.0
description = "Screen pixel scaling factor for the Bayer dither matrix"

[[params]]
name = "blend"
type = "float"
default = 1.0
min = 0.0
max = 1.0
description = "Blend amount between original color and dithered output"
